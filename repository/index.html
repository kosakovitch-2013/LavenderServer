<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavender Linux Repository</title>
</head>
<body>
  <h1>Lavender Linux Repository</h1>

  <p>Package files for Lavender Linux.</p>

  <button id="backButton" hidden>Back</button>

  <p id="currentPath">/</p>

  <ul id="repository">
    <li>Loading repository...</li>
  </ul>

  <script>
    const owner = "kosakovitch-2013";
    const repo = "Petals";

    const repository = document.getElementById("repository");
    const backButton = document.getElementById("backButton");
    const currentPath = document.getElementById("currentPath");

    let pathHistory = [];
    let currentDirectory = "";

    function loadDirectory(path = "") {
      currentDirectory = path;
      currentPath.textContent = "/" + path;
      repository.innerHTML = "<li>Loading...</li>";

      const apiUrl =
        "https://api.github.com/repos/" +
        owner +
        "/" +
        repo +
        "/contents/" +
        path;

      fetch(apiUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error("Unable to load directory");
          }

          return response.json();
        })
        .then(files => {
          repository.innerHTML = "";

          files.forEach(file => {
            const item = document.createElement("li");

            if (file.type === "dir") {
              const button = document.createElement("button");

              button.textContent = file.name + "/";
              button.addEventListener("click", () => {
                pathHistory.push(currentDirectory);
                loadDirectory(file.path);
              });

              item.appendChild(button);
            } else {
              item.textContent = file.name;
            }

            repository.appendChild(item);
          });

          backButton.hidden = pathHistory.length === 0;
        })
        .catch(error => {
          repository.innerHTML =
            "<li>Unable to load this directory.</li>";

          console.error(error);
        });
    }

    backButton.addEventListener("click", () => {
      const previousDirectory = pathHistory.pop();
      loadDirectory(previousDirectory);

      backButton.hidden = pathHistory.length === 0;
    });

    loadDirectory();
  </script>
</body>
</html>
