<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavender Linux Repository</title>
</head>
<body>
  <h1>Lavender Linux Repository</h1>

  <p>Package files for Lavender Linux.</p>

  <h2>Petals Package Repository</h2>

  <ul id="repository">
    <li>Loading repository...</li>
  </ul>

  <script>
    const repository = document.getElementById("repository");

    fetch("https://api.github.com/repos/kosakovitch-2013/Petals/contents")
      .then(response => response.json())
      .then(files => {
        repository.innerHTML = "";

        files.forEach(file => {
          const item = document.createElement("li");
          item.textContent = file.name;
          repository.appendChild(item);
        });
      })
      .catch(error => {
        repository.innerHTML = "<li>Unable to load repository.</li>";
        console.error(error);
      });
  </script>
</body>
</html>
